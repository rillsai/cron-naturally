name: Release

# Publishes to npm when a GitHub Release is published.
# Security model:
#   - No long-lived npm token. Auth is npm Trusted Publishing via OIDC, so
#     there is no secret to steal (the root cause of recent npm supply-chain
#     compromises was leaked/long-lived publish tokens).
#   - Provenance is attached (--provenance), cryptographically signing the
#     build via Sigstore so consumers can verify it came from this repo + CI.
#   - The `release` environment gates publishing behind a manual approval.
#   - Actions are pinned to commit SHAs; GITHUB_TOKEN is read-only.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A protected environment named "release" has a required reviewer.
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing requires npm >= 11.5.1, newer than what Node bundles.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint
      - run: npm run check-types
      - run: npm test
      - run: npm run build

      # Defense in depth: refuse to publish if the release tag and the
      # package.json version disagree.
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match package.json version '${PKG_VERSION}'."
            exit 1
          fi

      # No NODE_AUTH_TOKEN: auth + provenance come from the OIDC id-token.
      - name: Publish to npm
        run: npm publish --provenance --access public
